
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131d">
<title>MusicStudio Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131d;color:#f5f6fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:22px 18px;background:#191e2d;border-bottom:1px solid #30384d}
h1{margin:0;font-size:25px;letter-spacing:1px}
.sub{color:#929db5;font-size:12px;margin-top:6px}
main{padding:16px;max-width:850px;margin:auto}
.panel{background:#1b2131;border:1px solid #30384d;border-radius:15px;padding:16px;margin-bottom:15px}
h2{font-size:16px;margin:0 0 14px}
select,input,button{font:inherit}
select{background:#111725;color:white;border:1px solid #3b4660;padding:11px;border-radius:9px;width:100%}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:10px;padding:12px;background:#5965ed;color:white;font-weight:600}
button.secondary{background:#30394e}
button:active{opacity:.75}
label{font-size:12px;color:#aab4c9;display:block;margin:12px 0 7px}
input[type=range]{width:100%;accent-color:#737cff}
.status{font-size:12px;color:#9eabc5;margin-top:12px}
.keyboard{display:flex;overflow-x:auto;padding:8px 0 12px;gap:3px}
.key{flex:0 0 42px;height:145px;background:#f5f5f5;border-radius:0 0 7px 7px;color:#202333;display:flex;align-items:end;justify-content:center;padding-bottom:10px;font-size:11px;border:1px solid #c8c8c8}
.key.black{background:#252b3b;color:white;height:95px;flex-basis:29px;margin-left:-16px;margin-right:-16px;z-index:2;border:1px solid #111}
.key:active{background:#aeb6ff}
.note{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #30384d;font-size:13px}
.empty{color:#8995ac;text-align:center;padding:20px;font-size:13px}
footer{text-align:center;color:#68748c;font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
<h1>MusicStudio Pro</h1>
<div class="sub">DIGITAL MUSIC WORKSTATION · MOBILE EDITION</div>
</header>
<main>
<section class="panel">
<h2>音源控制台</h2>
<label>选择音色</label>
<select id="instrument">
<option value="piano">钢琴</option>
<option value="electric">电钢琴</option>
<option value="organ">电子风琴</option>
<option value="synth">合成器</option>
<option value="bass">电子贝斯</option>
<option value="bell">钟琴</option>
</select>
<label>主音量</label>
<input id="volume" type="range" min="0" max="100" value="65">
<div class="status" id="status">音频引擎尚未启动，请点击启动音频。</div>
</section>

<section class="panel">
<h2>虚拟钢琴</h2>
<div class="keyboard" id="keyboard"></div>
<div class="status">点击琴键即可演奏。横向滑动可查看更多琴键。</div>
</section>

<section class="panel">
<h2>音乐控制</h2>
<div class="controls">
<button id="start">启动音频</button>
<button class="secondary" id="stop">停止声音</button>
<button class="secondary" id="add">添加音符</button>
<button class="secondary" id="clear">清空乐谱</button>
</div>
<div class="status">点击钢琴琴键演奏，再点击“添加音符”记录当前音符。</div>
</section>

<section class="panel">
<h2>我的乐谱</h2>
<div id="score"><div class="empty">还没有记录音符</div></div>
</section>
</main>
<footer>MusicStudio Pro · Prototype 0.1</footer>

<script>
const audio={
ctx:null,master:null,lastNote:null,active:[]
};
const names=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const keyboard=document.getElementById("keyboard");
const score=document.getElementById("score");
const status=document.getElementById("status");
let notes=[];

function frequency(midi){
return 440*Math.pow(2,(midi-69)/12);
}
function makeKeyboard(){
for(let midi=48;midi<=72;midi++){
const n=names[midi%12];
const oct=Math.floor(midi/12)-1;
const key=document.createElement("button");
key.className="key"+(n.includes("#")?" black":"");
key.textContent=n+oct;
key.addEventListener("pointerdown",()=>{
playNote(midi);
audio.lastNote=n+oct;
});
keyboard.appendChild(key);
}
}
async function startAudio(){
const AC=window.AudioContext||window.webkitAudioContext;
if(!AC){status.textContent="当前浏览器不支持 Web Audio。";return}
if(!audio.ctx){
audio.ctx=new AC();
audio.master=audio.ctx.createGain();
audio.master.connect(audio.ctx.destination);
}
if(audio.ctx.state==="suspended")await audio.ctx.resume();
audio.master.gain.value=Number(document.getElementById("volume").value)/100;
status.textContent="音频引擎已启动，可以演奏。";
}
function playNote(midi){
if(!audio.ctx){status.textContent="请先点击启动音频。";return}
const ctx=audio.ctx;
const osc=ctx.createOscillator();
const gain=ctx.createGain();
const type=document.getElementById("instrument").value;
osc.type=type==="bass"?"sawtooth":type==="bell"?"sine":type==="organ"?"square":"triangle";
osc.frequency.value=frequency(midi);
gain.gain.setValueAtTime(0.0001,ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.015);
gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.7);
osc.connect(gain);gain.connect(audio.master);
osc.start();osc.stop(ctx.currentTime+.72);
audio.active.push(osc);
audio.lastNote=names[midi%12]+(Math.floor(midi/12)-1);
}
function renderScore(){
score.innerHTML="";
if(!notes.length){
score.innerHTML='<div class="empty">还没有记录音符</div>';return;
}
notes.forEach((note,i)=>{
const row=document.createElement("div");
row.className="note";
const name=document.createElement("span");
name.textContent=(i+1)+". "+note;
const remove=document.createElement("button");
remove.textContent="删除";
remove.className="secondary";
remove.style.padding="5px 10px";
remove.onclick=()=>{notes.splice(i,1);renderScore()};
row.append(name,remove);score.appendChild(row);
});
}
document.getElementById("start").onclick=startAudio;
document.getElementById("stop").onclick=()=>{
if(audio.ctx){
audio.master.gain.setTargetAtTime(0,audio.ctx.currentTime,.02);
status.textContent="声音已停止。";
}
};
document.getElementById("add").onclick=()=>{
if(!audio.lastNote){status.textContent="请先点击一个琴键。";return}
notes.push(audio.lastNote);renderScore();
};
document.getElementById("clear").onclick=()=>{
notes=[];renderScore();
};
document.getElementById("volume").oninput=e=>{
if(audio.master)audio.master.gain.value=Number(e.target.value)/100;
};
makeKeyboard();
</script>
</body>
</html>
